<html>
<head>
<title>Travel/Booking Website</title>
<style>
footer {
text-align: center;
padding: 10px;
background-color: #333;
color: white;
}
</style>
</head>
<body>
<form>
Gust Name:
<input type="text">
<br><br>
Email:
<input type="email">
<br><br>
Phone Number:
<input type="telephone" pattern="[0-9]{10}"
required>
<br><br>
Check-in-Date:
<input type="date">
<br><br>
Check-out-Date:
<input type="date">
<br><br>
Number of Guests:
<input type="Number">
<br><br>
Room Type:
<select>
<option>Deluxe Room</option>
<option>Family Room</option>
<option>Suite</option>
</select>
<br><br>
Gender:
<input type="radio"name="g">Male
<input type="radio"name="g">Female
<br><br>
Facilities Required:
<br>
<input type="checkbox">Food<br>
<input type="checkbox">Pool<br>
Special Requests:
<br>
<textarea rows="5"cols="30"></textarea>
<br><br>
Upload ID Proof:
<input type="file">
<br><br>
<input type="submit"value="Book Now">
<input type="reset"value="Reset">
</form>
<footer>
<p>© 2026 Paradise Resort | All Rights Reserved</p>
</footer>


</body>
</html>
